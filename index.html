<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6c5ce7">
    <title>Messenger</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/components.css">
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js",
                "firebase/storage": "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js",
                "firebase/messaging": "https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js",
                "simple-peer": "./simple-peer.js",
                "RecordRTC": "./RecordRTC.js"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <div id="sidebar"></div>
        <div id="chatArea"></div>
        <div id="callOverlay" style="display: none;"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('SW registered', reg))
                .catch(err => console.error('SW failed', err));
        }
    </script>

    <script type="module" src="js/app.js"></script>
</body>
</html>
